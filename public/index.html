<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weatherman — Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/index.css">

    <!-- update the version number as needed -->
    <script defer src="/__/firebase/12.14.0/firebase-app-compat.js"></script>
    <!-- include only the Firebase features as you need -->
    <script defer src="/__/firebase/12.14.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.14.0/firebase-database-compat.js"></script>
    <script defer src="/__/firebase/12.14.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/12.14.0/firebase-functions-compat.js"></script>
    <script defer src="/__/firebase/12.14.0/firebase-messaging-compat.js"></script>
    <script defer src="/__/firebase/12.14.0/firebase-storage-compat.js"></script>
    <script defer src="/__/firebase/12.14.0/firebase-analytics-compat.js"></script>
    <script defer src="/__/firebase/12.14.0/firebase-remote-config-compat.js"></script>
    <script defer src="/__/firebase/12.14.0/firebase-performance-compat.js"></script>
    <!-- 
      initialize the SDK after all desired features are loaded, set useEmulator to false
      to avoid connecting the SDK to running emulators.
    -->
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

  </head>
  <body>
    
    <div class="shell">

      <!-- ════ LEFT PANEL ════ -->
      <div class="panel">

        <!-- Logo -->
        <div class="logo">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none" style="fill:var(--accent)"/></svg>
        </div>

        <!-- Tab switcher -->
        <div class="tabs">
          <button class="tab-btn tab-login active" data-target="login-section">Log In</button>
          <button class="tab-btn tab-signup"       data-target="signup-section">Sign Up</button>
        </div>

        <!-- ── FORM AREA ── -->
        <div class="form-area">

          <!-- ════ LOGIN SECTION ════ -->
          <div class="login-section section">
            <h1>Weatherman</h1>
            <p class="sub">Log in with your credentials.</p>

            <input class="field" type="email" placeholder="Email" autocomplete="email"/>
            <input class="field" type="password" placeholder="Password" autocomplete="current-password"/>
            <button class="cta">Sign In</button>

            <div class="divider">or sign in with google</div>

            <div class="socials">
              <!-- Google -->
              <button class="social-btn" aria-label="Google" onClick="googleSignin()">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- ════ SIGNUP SECTION ════ -->
          <div class="signup-section section">
            <p class="sub">Sign up or sign up with google.</p>

            <input class="field" type="text"     placeholder="Full name"     autocomplete="name"/>
            <input class="field" type="email"    placeholder="Email"         autocomplete="email"/>
            <input class="field" type="password" placeholder="Password"      autocomplete="new-password"/>
            <button class="cta">Create Account</button>

            <div class="divider">or sign up with google</div>

            <div class="socials">
              <button class="social-btn" aria-label="Google" onClick="googleSignup()">
                <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              </button>
            </div>
          </div>

        </div><!-- /form-area -->

        <!-- Footer -->
        <footer>
          <div class="foot-links">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
          </div>
          <span class="brand">weatherman.app</span>
        </footer>
      </div><!-- /panel -->

      <!-- ════ RIGHT PANEL ════ -->
      <div class="illustration"></div>

    </div><!-- /shell -->
    
    <script src="js/index.js"></script>>
    <script src="js/auth.js"></script>
  </body>
</html>
